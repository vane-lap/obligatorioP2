<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Ilustración de un expediente bajo investigación">
  <defs>
    <linearGradient id="fxFolderBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9a24c"/>
      <stop offset="1" stop-color="#a9852f"/>
    </linearGradient>
    <linearGradient id="fxFolderFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8ca7b"/>
      <stop offset="1" stop-color="#cfa955"/>
    </linearGradient>
    <clipPath id="fxLens">
      <circle cx="350" cy="214" r="50"/>
    </clipPath>
  </defs>

  <!-- Halos de fondo -->
  <circle cx="240" cy="190" r="165" fill="#ffffff" fill-opacity=".04"/>
  <circle cx="240" cy="190" r="120" fill="#ffffff" fill-opacity=".05"/>
  <ellipse cx="240" cy="326" rx="170" ry="12" fill="#000000" fill-opacity=".22"/>

  <!-- Carpeta: parte trasera -->
  <path d="M90 110 a10 10 0 0 1 10 -10 h84 l18 20 h168 a10 10 0 0 1 10 10 v170 a10 10 0 0 1 -10 10 h-270 a10 10 0 0 1 -10 -10 z" fill="url(#fxFolderBack)"/>

  <!-- Hojas del expediente -->
  <g transform="rotate(-5 230 180)">
    <rect x="122" y="88" width="200" height="150" rx="6" fill="#e9eef6"/>
  </g>
  <g transform="rotate(3 240 180)">
    <rect x="130" y="80" width="210" height="160" rx="6" fill="#ffffff"/>
    <rect x="150" y="102" width="96" height="8" rx="4" fill="#1b3563"/>
    <rect x="150" y="120" width="120" height="6" rx="3" fill="#c9d3e3"/>
    <rect x="150" y="134" width="104" height="6" rx="3" fill="#c9d3e3"/>
    <rect x="150" y="148" width="116" height="6" rx="3" fill="#c9d3e3"/>
    <rect x="282" y="100" width="40" height="48" rx="4" fill="#e3e8f0"/>
    <circle cx="302" cy="117" r="8" fill="#9aa8bf"/>
    <path d="M288 148 c1 -15 27 -15 28 0 z" fill="#9aa8bf"/>
  </g>

  <!-- Carpeta: parte delantera -->
  <path d="M84 160 a8 8 0 0 1 8 -8 h300 a8 8 0 0 1 8 9 l-14 141 a10 10 0 0 1 -10 9 h-270 a10 10 0 0 1 -10 -9 l-14 -133 z" fill="url(#fxFolderFront)"/>
  <rect x="133" y="182" width="180" height="36" rx="5" fill="#fbf4e1" stroke="#a9852f" stroke-width="1.5"/>
  <text x="223" y="204.5" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#12264a">EXPEDIENTE N.º 0427</text>

  <!-- Sello -->
  <g transform="rotate(-10 203 262)" opacity=".9">
    <rect x="115" y="244" width="176" height="36" rx="5" fill="none" stroke="#b42318" stroke-width="3"/>
    <text x="203" y="267.5" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="15" font-weight="800" letter-spacing="3" fill="#b42318">CONFIDENCIAL</text>
  </g>

  <!-- Lupa -->
  <line x1="390" y1="254" x2="430" y2="294" stroke="#e9eef7" stroke-width="16" stroke-linecap="round"/>
  <line x1="406" y1="270" x2="430" y2="294" stroke="#c8a24a" stroke-width="16" stroke-linecap="round"/>
  <circle cx="350" cy="214" r="50" fill="#dbe6f6" fill-opacity=".6"/>
  <g clip-path="url(#fxLens)" fill="none" stroke="#1b3563" stroke-width="2.4" stroke-linecap="round" opacity=".8">
    <path d="M336 246 c-10 -16 -6 -40 14 -42 c20 -2 28 18 22 40"/>
    <path d="M328 238 c-8 -22 2 -46 24 -45 c22 1 30 24 24 46"/>
    <path d="M344 250 c-6 -12 -4 -30 7 -31 c12 -1 14 14 12 28"/>
    <path d="M352 252 c0 -10 -2 -18 -1 -24"/>
    <path d="M320 226 c2 -28 24 -42 44 -36 c16 5 24 22 22 40"/>
    <path d="M318 206 c8 -18 30 -26 48 -16"/>
  </g>
  <circle cx="350" cy="214" r="50" fill="none" stroke="#e9eef7" stroke-width="10"/>
  <path d="M318 196 a36 36 0 0 1 22 -20" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity=".7"/>

  <!-- Destellos -->
  <g fill="#e4c77a">
    <path d="M70 80 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3 z"/>
    <path d="M420 120 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2 z"/>
    <path d="M444 300 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2 z" opacity=".7"/>
  </g>
</svg>
